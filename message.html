<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A message for you 💌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --forest: #1f3d2b;
    --forest-dark: #142b1c;
    --forest-mid: #2f5c3f;
    --cream: #fdf6e3;
    --cream-soft: #f3ead2;
    --gold: #d4b483;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  html, body{
    height:100%;
    width:100%;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-soft) 55%, #e7dcb8 100%);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 1.6rem;
  }

  .letter-card{
    background: var(--cream);
    border: 3px solid var(--gold);
    border-radius: 20px;
    max-width: 520px;
    width:100%;
    padding: 2.2rem 2rem;
    text-align:center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 1.4rem;
    opacity: 0;
    transform: translateY(16px);
    animation: letterFadeIn 0.9s ease forwards;
  }

  @keyframes letterFadeIn{
    to{ opacity: 1; transform: translateY(0); }
  }

  .letter-title{
    color: var(--forest-dark);
    font-size: clamp(1.4rem, 5vw, 2.1rem);
    letter-spacing: 0.5px;
    font-weight: bold;
    margin-bottom: 0.2rem;
  }

  .letter-body{
    color: var(--forest-dark);
    font-size: clamp(1rem, 3.4vw, 1.15rem);
    line-height: 1.8;
    text-align: left;
    white-space: pre-line;
  }

  .letter-signature{
    align-self: flex-end;
    color: var(--forest-mid);
    font-style: italic;
    font-size: clamp(1rem, 3.4vw, 1.15rem);
  }

  .back-btn{
    padding: 0.75rem 1.6rem;
    font-size: 1rem;
    border-radius: 40px;
    border: 2px solid var(--gold);
    background: var(--cream-soft);
    color: var(--forest-dark);
    cursor:pointer;
    letter-spacing: 0.5px;
    text-decoration: none;
    display:inline-block;
    transition: transform 0.15s ease;
  }

  .back-btn:hover{
    transform: scale(1.05);
  }

  .music-toggle{
    position:fixed;
    top: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: var(--forest);
    color: var(--cream);
    font-size: 1.1rem;
    cursor:pointer;
    z-index: 20;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform 0.2s ease;
  }

  .music-toggle:hover{
    transform: scale(1.08);
  }

  .music-toggle.muted{
    opacity: 0.55;
  }
</style>
</head>
<body>

  <audio id="bgMusic" src="song_mp3.mp3" loop preload="auto"></audio>
  <button class="music-toggle" id="musicToggle" title="Mute/unmute music">🔊</button>


  <div class="letter-card">
    <div class="letter-title">A little message for you 💌</div>
    <div class="letter-body">My dearest,
Happy birthday bebe,

            I
</div>
    <div class="letter-signature">— Always yours</div>
    <a class="back-btn" href="birthday.html">Back</a>
  </div>

<script src="music-sync.js"></script>
<script>

  initBgMusic('bgMusic', 'musicToggle');

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      window.location.href = 'birthday.html';
    }
  });
</script>

</body>
</html>
